// The signing contract over the wire, operation for operation as ISigningService defines it in
// ModularCA.Shared. The node calls this through RemoteSigningService; the signer role serves it
// through SignerGrpcService over InProcessSigningService. Identifiers cross as their string
// forms: GUIDs in their canonical "D" form, an empty string for none; enums as their member
// names, which is also how the signer's audit records them.
//
// A refusal is a gRPC status of PermissionDenied whose detail is the refusal message and whose
// trailer "modularca-refusal-reason" carries the SigningRefusalReason member name, so the
// client rethrows the same SigningRefusedException the in-process signer would have thrown.
syntax = "proto3";

package modularca.signer.v1;

option csharp_namespace = "ModularCA.Signer.Wire";

service Signer {
  rpc Sign (SignRequest) returns (SignResponse);
  rpc Decrypt (DecryptRequest) returns (DecryptResponse);
  rpc GenerateKey (GenerateKeyRequest) returns (GenerateKeyResponse);
  rpc CommitKey (CommitKeyRequest) returns (CommitKeyResponse);
  rpc ImportKey (ImportKeyRequest) returns (ImportKeyResponse);
  rpc ExportKey (ExportKeyRequest) returns (ExportKeyResponse);
  rpc ListKeys (ListKeysRequest) returns (ListKeysResponse);
  rpc RetireKey (RetireKeyRequest) returns (RetireKeyResponse);
  rpc WrapSecret (WrapSecretRequest) returns (WrapSecretResponse);
  rpc UnwrapSecret (UnwrapSecretRequest) returns (UnwrapSecretResponse);
  rpc Health (HealthRequest) returns (HealthResponse);
  // Added with the SSH keystore. A signer that predates it answers UNIMPLEMENTED, which the
  // client reports as a refusal saying the signer must be upgraded first.
  rpc SignSshCertificate (SignSshCertificateRequest) returns (SignSshCertificateResponse);
}

// A reference to a stored key: the certificate id and the keystore name. An SSH CA key has no
// certificate: in ssh-ca.keystore, certificate_id carries its SshCaKeys row id, here and in
// CommitKeyRequest and KeyMaterial.
message KeyRef {
  string certificate_id = 1;
  string keystore = 2;
}

// Who is asking, what for, and on whose behalf; the ceremony the operation executes, if any.
message SigningContext {
  string caller = 1;
  string purpose = 2;
  string space_id = 3;
  string ca_id = 4;
  string ceremony_id = 5;
  // True only when the caller states the operation is for the instance (space_id empty).
  // An older client omits it, and an empty space_id alone is never read as the instance.
  bool instance_scope = 6;
}

// The signer parses data before it signs: it must be one DER object of the structure the key
// and context.purpose sign (a TBSCertificate, a TBSCertList, an OCSP ResponseData, CMS signed
// attributes, a CMP ProtectedPart, a CertificationRequestInfo), naming the algorithm given
// where it names one. Nothing was added to the message for this; the refusal reasons
// UntypedData, AlgorithmMismatch, IssuerMismatch and EvidenceRequired are new names in the
// trailer, which a client older than the signer does not know.
message SignRequest {
  KeyRef key = 1;
  string algorithm = 2;
  bytes data = 3;
  SigningContext context = 4;
}

message SignResponse {
  bytes signature = 1;
}

// A critical option or an extension of an SSH certificate.
message SshOption {
  string name = 1;
  string value = 2;           // empty for flag extensions
}

// An SSH certificate for the signer to build and sign. There is no field for the nonce, the
// signature key or the signature algorithm: the signer makes the first, writes its own public
// key as the second and derives the third from it. The signer refuses fields that are malformed
// or break a rule of the SSH CA key (UntypedData), and audits every call with the type, serial,
// key id, validity and the number of principals.
message SignSshCertificateRequest {
  KeyRef key = 1;             // (SshCaKeys.Id, "ssh-ca.keystore")
  bytes subject_public_key = 2;   // OpenSSH wire-format public key blob
  string cert_type = 3;       // "user" | "host"
  uint64 serial = 4;
  string key_id = 5;
  repeated string principals = 6;
  int64 valid_after = 7;      // Unix seconds
  int64 valid_before = 8;
  repeated SshOption critical_options = 9;
  repeated SshOption extensions = 10;
  SigningContext context = 11;    // purpose SshCertificate, ca_id = the SSH CA's row, instance scope
}

message SignSshCertificateResponse {
  bytes certificate = 1;      // the full certificate blob; the node renders "type base64 comment"
}

message DecryptRequest {
  KeyRef key = 1;
  bytes enveloped = 2;
  SigningContext context = 3;
}

message DecryptResponse {
  bytes content = 1;
}

message KeySpec {
  string algorithm = 1;
  string size_or_curve = 2;
  optional string label = 3;
  // What the key is for: empty for a key that will belong to an X.509 certificate, which is
  // what a client older than this field sends; "ssh" for an SSH CA key, minted in
  // ssh-ca.keystore. A signer older than this field ignores it and returns a key reference in
  // ca-certs.keystore, so a client that asked for "ssh" tells by the keystore of the reference.
  string usage = 4;
}

message GenerateKeyRequest {
  KeySpec spec = 1;
  SigningContext context = 2;
}

message GenerateKeyResponse {
  KeyRef key = 1;
  bytes public_key_der = 2;
}

message CommitKeyRequest {
  KeyRef key = 1;
  string certificate_id = 2;
  SigningContext context = 3;
}

message CommitKeyResponse {
}

message KeyMaterial {
  bytes wrapped = 1;
  string format = 2;
  string certificate_id = 3;
  string keystore = 4;
}

message ImportKeyRequest {
  KeyMaterial material = 1;
  SigningContext context = 2;
}

message ImportKeyResponse {
  KeyRef key = 1;
}

message ExportWrap {
  string format = 1;
  string password = 2;
  repeated bytes chain = 3;
}

message ExportKeyRequest {
  KeyRef key = 1;
  ExportWrap wrap = 2;
  SigningContext context = 3;
}

message ExportKeyResponse {
  bytes wrapped = 1;
}

message ListKeysRequest {
  SigningContext context = 1;
}

message KeyInfo {
  KeyRef key = 1;
  bytes public_key_der = 2;
  string kind = 3;
  string ca_id = 4;
  string space_id = 5;
  string backend = 6;
}

message ListKeysResponse {
  repeated KeyInfo keys = 1;
}

message RetireKeyRequest {
  KeyRef key = 1;
  SigningContext context = 2;
}

message RetireKeyResponse {
}

// A secret the node has to keep but cannot hold in the clear. No key is named: the kind says
// what the secret is, and the signer decides which key wraps for it. The secret crosses in the
// clear inside the mutual-TLS channel, in both directions, because the node has to use it.
message WrapSecretRequest {
  string kind = 1;
  bytes secret = 2;
  SigningContext context = 3;
  // Where the blob will be kept, for a secret that is bound to its place. Set, the signer
  // returns a blob that unwraps only for the same binding; empty, one with no binding.
  string binding = 4;
}

message WrapSecretResponse {
  bytes wrapped = 1;
}

// Nothing here but the blob and who is asking: the kind the policy is applied to and the id of
// the key to derive from are read out of the blob's own header, so a caller cannot reach a kind
// it is not permitted by describing it differently.
message UnwrapSecretRequest {
  bytes wrapped = 1;
  SigningContext context = 2;
  // Where the caller read the blob from. It has to be the binding the blob was wrapped under,
  // and empty for a blob that has none.
  string binding = 3;
}

message UnwrapSecretResponse {
  bytes secret = 1;
}

message HealthRequest {
}

message HealthResponse {
  bool unlocked = 1;
  int32 key_count = 2;
  string backend = 3;
}
