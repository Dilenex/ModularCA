# Replaces the stream block the dist ships in deploy/nginx-modularca.conf. Same passthrough
# (nginx never decrypts; each node terminates TLS with its own certificate), plus a map from the
# name in the client's TLS hello to the node that owns it. Unknown names go to the host install.
stream {
    log_format modularca '$remote_addr [$time_local] $protocol $status '
                         '$bytes_sent/$bytes_received $session_time "$ssl_preread_server_name"';
    access_log /var/log/nginx/modularca-stream.log modularca;
    error_log  /var/log/nginx/modularca-stream-error.log warn;

    map $ssl_preread_server_name $modularca_https {
        ca.lab.msae.test     127.0.0.1:18443;   # the spike node
        default              127.0.0.1:8443;    # the host install, ca4.maroongang.net
    }
    map $server_name $modularca_http {
        default              127.0.0.1:8080;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $modularca_https;
        proxy_connect_timeout 10s;
        proxy_timeout 1h;
    }
    # Plain HTTP carries CRL, OCSP and AIA. It has no server name to route by, so it reaches
    # the host install; a node's own distribution URLs use its https name. Revisit when a node
    # must serve plain-HTTP revocation under its own name (an http block routing by Host).
    server {
        listen 80;
        listen [::]:80;
        proxy_pass 127.0.0.1:8080;
        proxy_connect_timeout 5s;
        proxy_timeout 60s;
    }
}
