# ModularCA — Debian nftables port redirect
#
#   inbound :80  -> :8080
#   inbound :443 -> :8443
#
# Debian 11+ uses nftables by default (iptables is an nft shim). Install with:
#
#     sudo cp deploy/nftables-modularca.conf /etc/nftables.d/modularca.conf
#     # ensure /etc/nftables.conf ends with:  include "/etc/nftables.d/*.conf"
#     sudo nft -c -f /etc/nftables.conf        # syntax check, changes nothing
#     sudo systemctl enable --now nftables
#     sudo systemctl reload nftables
#
# Verify:  sudo nft list table inet modularca_nat
#
# ── Prefer CAP_NET_BIND_SERVICE over this ─────────────────────────────────────
#
# The shipped systemd unit already grants CAP_NET_BIND_SERVICE, so Kestrel can bind
# 80/443 directly. Set Http.Port: 80 and Https.Port: 443 in config/config.yaml and you
# need none of this. Use nftables only when the ports must stay unprivileged (shared
# host, another service already owns 80/443, or policy forbids the capability).
#
# ── PREROUTING ONLY. Do not add an output chain. ──────────────────────────────
#
# It is tempting to add a `hook output` rule so the box can reach its own service on
# :80. Do not do it with a bare `tcp dport 80 redirect` — that rewrites the server's
# OUTBOUND connections too, and ModularCA makes a lot of them:
#
#   * ACME http-01 validation fetches http://<subscriber-domain>/.well-known/acme-
#     challenge/<token> on port 80. An output redirect sends that to your own
#     localhost:8080 instead — every http-01 validation breaks, and a challenge could
#     be answered by your own server rather than the domain being validated.
#   * CT log submission, webhooks, OCSP/CRL fetching and apt all leave on 80/443.
#
# If the host genuinely must reach itself by public name, scope the rule to this
# machine's own address only — never to the whole port:
#
#     chain output {
#         type nat hook output priority -100; policy accept;
#         ip daddr <THIS-HOSTS-PUBLIC-IP> tcp dport 80  redirect to :8080
#         ip daddr <THIS-HOSTS-PUBLIC-IP> tcp dport 443 redirect to :8443
#     }

table inet modularca_nat {
    chain prerouting {
        # dstnat priority so the rewrite happens before routing/filtering.
        type nat hook prerouting priority dstnat; policy accept;

        # redirect = DNAT to this host, source address untouched — so Kestrel still
        # sees the real client IP. That is the whole reason to do this in the kernel
        # rather than with a userspace proxy: audit rows, the per-IP login rate
        # limiter and the setup wizard's localhost gate all keep working correctly.
        #
        # `inet` family covers IPv4 and IPv6 in one table.

        # Plain HTTP: CRL, OCSP, AIA, ACME http-01. Must NOT be redirected to TLS —
        # RFC 5280 requires revocation data to be fetchable without HTTPS.
        tcp dport 80 redirect to :8080

        # HTTPS: portals, API, and the SNI-gated mTLS auth subdomain. A kernel
        # redirect does not touch TLS, so the client-certificate handshake and chain
        # validation behave exactly as they do on a direct bind.
        tcp dport 443 redirect to :8443
    }
}
