# ModularCA — run modularca.service as the control plane only
#
# The console, the setup wizard, the admin, auth, user and account API, plus /health, and every
# scheduled job and startup write that mutates: CRL generation and publishing, LDAP publishing,
# renewals, backups, audit retention, TLS renewal, migrations. No enrollment protocol and no
# distribution: those hosts serve them. This is the process to keep behind the admin network.
#
# Install on the control host:
#   sudo mkdir -p /etc/systemd/system/modularca.service.d
#   sudo cp /opt/modularca/deploy/dropins/role-control.conf /etc/systemd/system/modularca.service.d/role.conf
#   sudo systemctl daemon-reload && sudo systemctl restart modularca
#
# ExecStart= is emptied first because systemd appends a second ExecStart= otherwise.
# See README-DEPLOY.md, "Three processes: signer, control, enrollment and validation".

[Service]
ExecStart=
ExecStart=/opt/modularca/ModularCA.API --role control
