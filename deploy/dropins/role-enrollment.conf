# ModularCA — run modularca.service as the enrollment role only
#
# The enrollment protocols and nothing else: ACME, EST, SCEP, CMP, MSAE, token and integration
# enrollment, the TSA, plus /health. The scheduler runs only the protocol cleanup jobs, under its
# own lease. No console, no distribution, no plain-HTTP listener. Everything issued goes through
# the signer this host's Signer section names; enrollment answers 503 until it is unlocked.
#
# For enrollment and validation together on one host, use --role enrollment,validation instead.
#
# Install on the enrollment host:
#   sudo mkdir -p /etc/systemd/system/modularca.service.d
#   sudo cp /opt/modularca/deploy/dropins/role-enrollment.conf /etc/systemd/system/modularca.service.d/role.conf
#   sudo systemctl daemon-reload && sudo systemctl restart modularca
#
# ExecStart= is emptied first because systemd appends a second ExecStart= otherwise.
# See README-DEPLOY.md, "Three processes: signer, control, enrollment and validation".

[Service]
ExecStart=
ExecStart=/opt/modularca/ModularCA.API --role enrollment
