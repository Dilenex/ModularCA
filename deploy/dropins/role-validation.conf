# ModularCA — run modularca.service as the validation role only
#
# Distribution and nothing else: CRL, OCSP, AIA and CA certificate serving on HTTPS and on the
# plain-HTTP listener (Http.Port), plus /health. No console, no enrollment protocol, no
# scheduler; OCSP is signed through the signer this host's Signer section names. The plain-HTTP
# port is usually 80 for CDP/AIA URLs, so the unit's CAP_NET_BIND_SERVICE stays useful here.
#
# Install on the validation host:
#   sudo mkdir -p /etc/systemd/system/modularca.service.d
#   sudo cp /opt/modularca/deploy/dropins/role-validation.conf /etc/systemd/system/modularca.service.d/role.conf
#   sudo systemctl daemon-reload && sudo systemctl restart modularca
#
# ExecStart= is emptied first because systemd appends a second ExecStart= otherwise.
# See README-DEPLOY.md, "Three processes: signer, control, enrollment and validation".

[Service]
ExecStart=
ExecStart=/opt/modularca/ModularCA.API --role validation
