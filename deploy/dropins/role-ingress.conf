# ModularCA — run modularca.service as the ingress only
#
# TLS termination for every hostname under the instance's web TLS certificate on Https.Port,
# plain HTTP on Http.Port routed by Host as well, and forwarding by name to the node that serves
# it: the Ingress.Routes list in config.yaml. No controller, no scheduler, no console, no key
# and no signer: the ingress host needs no keystore, no keystore password and no signer client
# certificate. A name with no upstream is answered 404 here, since this process hosts nothing
# itself; give every name a node. /health and /health/ready (the "ingress" entry: the route
# count, each upstream's probe) are served.
#
# The ports are usually 443 and 80, so the unit's CAP_NET_BIND_SERVICE is what lets it bind.
#
# Install on the ingress host:
#   sudo mkdir -p /etc/systemd/system/modularca.service.d
#   sudo cp /opt/modularca/deploy/dropins/role-ingress.conf /etc/systemd/system/modularca.service.d/role.conf
#   sudo systemctl daemon-reload && sudo systemctl restart modularca
#
# ExecStart= is emptied first because systemd appends a second ExecStart= otherwise.
# See README-DEPLOY.md, "The ingress in front of nodes".

[Service]
ExecStart=
ExecStart=/opt/modularca/ModularCA.API --role ingress
