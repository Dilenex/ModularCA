# ModularCA — nginx TCP forwarding template
#
#   80  -> 127.0.0.1:8080   (plain HTTP: CRL, OCSP, AIA, ACME http-01)
#   443 -> 127.0.0.1:8443   (HTTPS: portals, API, mTLS auth subdomain)
#
# Install: place in /etc/nginx/ and include from the TOP level of nginx.conf —
# `stream` is a sibling of `http`, NOT nested inside it:
#
#     # /etc/nginx/nginx.conf
#     include /etc/nginx/nginx-modularca.conf;
#
# Then:  sudo nginx -t && sudo systemctl reload nginx
#
# Requires the stream module (nginx -V | grep -o with-stream). On Debian/Ubuntu it
# ships in nginx-full / nginx-extras; on RHEL install nginx-mod-stream.
#
# ── Why stream (layer 4) and not a normal http proxy_pass ──────────────────────
#
# ModularCA serves its mTLS login flow from the SAME https port, gated by SNI: when
# the TLS ClientHello names Mtls.AuthSubdomain, Kestrel requests a client certificate;
# every other hostname gets a plain server-auth handshake. The client cert is then
# read back via HttpContext.Connection.GetClientCertificateAsync() for mTLS login and
# for EST simplereenroll.
#
# An http-level proxy TERMINATES TLS at nginx. The client certificate would stop at
# nginx, GetClientCertificateAsync() would return null, and mTLS login plus every EST
# renewal would break. Forwarding the cert in a header instead is not equivalent —
# the app validates a real chain against the enrolled signing CA, not a header.
#
# stream forwards raw TCP, so the TLS session is established end-to-end with Kestrel
# and the SNI gating, client-cert request and chain validation all behave exactly as
# they do without a proxy. It also means nginx needs no certificates of its own.
#
# ── COST: the client IP is lost. Read this before deploying. ──────────────────
#
# Layer-4 forwarding cannot add X-Forwarded-For (nginx never parses HTTP here), so
# Kestrel sees every connection as coming from 127.0.0.1. The app's UseForwardedHeaders
# cannot help — there is no header to read. Three things degrade:
#
#   1. Audit records. Every CertificateRevoked / UserLoginFailed / setup-wizard row
#      logs sourceIp 127.0.0.1. On a CA, that guts the audit trail's usefulness.
#   2. Login rate limiting. LoginRateLimitMiddleware keys its bucket on the client IP,
#      so ALL clients share one bucket: one attacker's failures throttle every
#      legitimate user, and per-IP lockout stops meaning anything.
#   3. The setup wizard's localhost gate. SetupController treats loopback callers as
#      local, so with this proxy in front, a remote caller looks local. It is still
#      gated by the X-Setup-Token and returns 404 once a CA exists, so this is not an
#      open door on a configured system — but the outer defence is gone.
#
# PREFERRED ALTERNATIVE — skip nginx entirely. If port forwarding is all that is
# needed, the shipped systemd unit already grants CAP_NET_BIND_SERVICE, so Kestrel can
# bind the privileged ports directly. Set in config/config.yaml:
#
#     Http:  { Port: 80 }
#     Https: { Port: 443 }
#
# That keeps real client IPs, keeps mTLS working, and removes a moving part. Use the
# stream config below only when nginx must sit in front for a reason this does not
# cover (shared host, existing vhosts on 80/443, upstream firewall policy).
#
# If you keep nginx AND need real client IPs, the only L4 option is IP-transparent
# forwarding (`proxy_bind $remote_addr transparent` plus policy routing, nginx as
# root). PROXY protocol is not usable here — Kestrel does not implement it.

stream {
    # Kestrel already logs every request; keep nginx's stream log to connection-level
    # facts so the two are not duplicating each other.
    log_format modularca '$remote_addr [$time_local] $protocol $status '
                         '$bytes_sent/$bytes_received $session_time "$ssl_preread_server_name"';

    access_log /var/log/nginx/modularca-stream.log modularca;
    error_log  /var/log/nginx/modularca-stream-error.log warn;

    upstream modularca_https {
        server 127.0.0.1:8443;
    }

    upstream modularca_http {
        server 127.0.0.1:8080;
    }

    # HTTPS — raw passthrough. No ssl_* directives here on purpose: nginx must not
    # terminate, inspect or re-encrypt. ssl_preread is enabled only so the SNI name
    # can be written to the access log; it does not terminate the connection.
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass modularca_https;

        # Kestrel's own TLS handshake timeout is 10s; keep nginx from cutting a slow
        # client-certificate selection short (the browser cert picker is user-driven).
        proxy_connect_timeout 10s;
        proxy_timeout 1h;
    }

    # Plain HTTP — CRL, OCSP, AIA and ACME http-01 must stay reachable WITHOUT TLS.
    # RFC 5280: a client validating a certificate cannot use HTTPS to fetch the CRL or
    # OCSP response that validates that same certificate. Do not add a redirect to
    # HTTPS here; it would break revocation checking for every relying party.
    server {
        listen 80;
        listen [::]:80;
        proxy_pass modularca_http;

        proxy_connect_timeout 5s;
        proxy_timeout 60s;
    }
}
