# nfpm package definition for the Ubuntu 24.04 (noble) .deb.
#
# Built by scripts/build-deb.sh, which stages the payload from the same publish the tarball uses
# and then invokes nfpm. See packaging/README-PACKAGING.md for the design decisions behind the
# layout and the uninstall behaviour.
#
# Why nfpm rather than debhelper: this repo is built from Windows git-bash as often as from
# Linux, and nfpm needs no Debian toolchain. The output is a binary .deb, which is what a
# directly-distributed package needs; a source package would only be required for a PPA or for
# inclusion in the Ubuntu archive.

name: modularca
arch: amd64
platform: linux

# Set by build-deb.sh from the VERSION file, converted to Debian ordering.
#
# The conversion matters: VERSION reads "0.1.0-rc3", and in dpkg's comparison "0.1.0-rc3" sorts
# AFTER "0.1.0" — so the eventual release would look like a downgrade and apt would refuse to
# install it over the candidate. A tilde sorts BEFORE, which is what a pre-release means, so the
# script rewrites it to "0.1.0~rc3".
version: ${DEB_VERSION}
version_schema: none
release: "1"

section: net
priority: optional
maintainer: ModularCA <noreply@edwardssite.com>
homepage: https://github.com/edphemeral/modularCA
license: AGPL-3.0-only

description: |
  Modular certificate authority with ACME, EST, SCEP, CMP and OCSP support.
  Ships a self-contained .NET runtime, so no system .NET installation is required.

# Empirically derived, not guessed: every shipped ELF was parsed for DT_NEEDED, and the two
# libraries .NET dlopens rather than links (OpenSSL and ICU) were confirmed by the soname strings
# embedded in libSystem.Security.Cryptography.Native.OpenSsl.so and libSystem.Globalization.Native.so.
#
#   linked   : libc6 (libc/libdl/libm/libpthread/librt), libgcc-s1, libstdc++6
#   dlopened : libssl.so.3 -> libssl3t64 on noble, libicuuc/libicui18n -> libicu74 on noble
#   bundled  : libsodium, zlib (inside libSystem.IO.Compression.Native.so) - no dependency
#
# Alternatives are listed so the package also installs on 22.04, where the same libraries carry
# pre-t64 names. Noble's name is listed first so it is the one chosen there.
#
# liblttng-ust is deliberately NOT declared. It is referenced only by libcoreclrtraceptprovider.so,
# which the runtime dlopens for optional LTTng tracing and does without silently.
#
# ca-certificates is a functional dependency rather than a linker one: without it the CA cannot
# validate outbound TLS for ACME, LDAPS or OCSP fetching, and the failures are opaque.
depends:
  - libc6
  - libgcc-s1
  - libstdc++6
  - libssl3t64 | libssl3
  - libicu74 | libicu72 | libicu70
  - ca-certificates
  - adduser

suggests:
  # Suggests, not Recommends: apt installs Recommends by default, and a deployment pointing at a
  # remote PostgreSQL would get a local server it never asked for and will never start. 14 or later.
  - postgresql

# Files carry the source mode, and on Windows every file reports 0666 — which nfpm would ship as
# world-readable AND group-writable. A umask normalises the whole tree to 0644 without needing a
# per-file rule. It cannot restore an executable bit, because Windows has none for nfpm to read;
# the two apphosts are therefore listed explicitly below.
umask: 0o022

contents:
  # The published payload.
  - src: ${STAGE}/
    dst: /opt/modularca
    type: tree

  # Debian expects a package's licensing at /usr/share/doc/<package>/. They are already in
  # /opt/modularca via the payload tree above, but an operator or an automated licence
  # scanner looks where the convention says to look, and a disclosure nobody finds has not
  # been made.
  - src: LICENSE
    dst: /usr/share/doc/modularca/copyright
  - src: THIRD-PARTY-NOTICES.md
    dst: /usr/share/doc/modularca/THIRD-PARTY-NOTICES.md

  # The two ELF entrypoints, declared separately so they land executable. nfpm refuses two
  # entries for one destination, so build-deb.sh moves these out of the payload tree first.
  # Without them the package installs a 0644 ModularCA.API and the unit fails on first start with
  # a permission error; postinst chmods them too, so an unpack-without-configure is still correct.
  - src: ${BINDIR}/ModularCA.API
    dst: /opt/modularca/ModularCA.API
    file_info:
      mode: 0755
  - src: ${BINDIR}/ModularCA.Keystore.Unlocker
    dst: /opt/modularca/ModularCA.Keystore.Unlocker
    file_info:
      mode: 0755
  # The MariaDB-to-PostgreSQL migration helper. It ships with the release it migrates TO, which
  # is the point: 0.3.1 refuses to start against MariaDB, and the tool that resolves that is
  # already installed by the time the operator reads the refusal.
  - src: ${BINDIR}/modularca-migrate
    dst: /opt/modularca/modularca-migrate
    file_info:
      mode: 0755

  # The schema-ownership repair, run as the PostgreSQL superuser. Root-owned and outside
  # /opt/modularca on purpose: the service account owns the runtime directories there (and before
  # 0.4.0 owned the whole tree), and a file the service account can write must never be run as a
  # superuser. build-deb.sh carves share/ out of
  # the payload tree so no copy lands under /opt/modularca. db-ownership.sh is the postinst step
  # that runs it on a local PostgreSQL; it also serves an operator by hand (check | repair).
  - src: ${SHAREDIR}/sql/adopt-ownership.sql
    dst: /usr/share/modularca/sql/adopt-ownership.sql
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: packaging/debian/db-ownership.sh
    dst: /usr/share/modularca/db-ownership.sh
    file_info:
      mode: 0755
      owner: root
      group: root

  # The KRL fetcher for SSH servers: a script, its systemd service and timer, and its settings.
  # None of it runs on the CA and none of it is enabled here; an administrator copies it from this
  # directory to each server. Listed one by one because the script needs its executable bit, which
  # a Windows build cannot carry in the tree.
  - src: ${SHAREDIR}/ssh-krl/modularca-krl-fetch.sh
    dst: /usr/share/modularca/ssh-krl/modularca-krl-fetch.sh
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: ${SHAREDIR}/ssh-krl/modularca-krl-fetch.service
    dst: /usr/share/modularca/ssh-krl/modularca-krl-fetch.service
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: ${SHAREDIR}/ssh-krl/modularca-krl-fetch.timer
    dst: /usr/share/modularca/ssh-krl/modularca-krl-fetch.timer
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: ${SHAREDIR}/ssh-krl/modularca-krl-fetch.env.example
    dst: /usr/share/modularca/ssh-krl/modularca-krl-fetch.env.example
    file_info:
      mode: 0644
      owner: root
      group: root

  # systemd unit under /lib, not /etc. /etc/systemd/system belongs to the administrator; a package
  # that writes there fights the operator's own overrides and cannot be cleanly upgraded. Local
  # changes belong in /etc/systemd/system/modularca.service.d/*.conf drop-ins.
  - src: deploy/modularca.service
    dst: /lib/systemd/system/modularca.service
    file_info:
      mode: 0644
  # The signer as its own unit, for the split install README-DEPLOY.md describes. Installed but
  # not enabled: a single-process install never starts it. prerm stops it and postinst starts it
  # again on an upgrade when it was running.
  - src: deploy/modularca-signer.service
    dst: /lib/systemd/system/modularca-signer.service
    file_info:
      mode: 0644

  # Familiar paths for operators. The application resolves config, keystores and logs relative to
  # its own base directory (AppContext.BaseDirectory, in 84 places), so these are links to the real
  # locations rather than the real locations themselves.
  - src: /opt/modularca/config
    dst: /etc/modularca
    type: symlink
  - src: /opt/modularca/logs
    dst: /var/log/modularca
    type: symlink
  # On the path, because the whole design of the helper is that an operator types one word. It
  # finds the deployment's db.yaml and borrows its own database role, so there is nothing to
  # assemble and no directory to be standing in.
  - src: /opt/modularca/modularca-migrate
    dst: /usr/local/bin/modularca-migrate
    type: symlink

  # Directories that must exist with the right modes before first run. Content is created at
  # runtime and is deliberately not package-owned, so dpkg will never remove it.
  - dst: /opt/modularca/keystores
    type: dir
    file_info:
      mode: 0700
  - dst: /opt/modularca/logs
    type: dir
    file_info:
      mode: 0750

scripts:
  preinstall: packaging/debian/preinst
  postinstall: packaging/debian/postinst
  preremove: packaging/debian/prerm
  postremove: packaging/debian/postrm
